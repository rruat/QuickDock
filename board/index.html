<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Espaço Infinito — QuickDock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="../icons/48.png" />
</head>
<body class="board-theme-scope">
  <!-- Cabeçalho / Barra Superior -->
  <header class="board-header">
    <div class="board-header-left">
      <button id="btn-board-back" class="board-btn icon-btn" title="Voltar para as notas" aria-label="Voltar para as notas">
        <span class="qd-icon material-symbols-rounded">arrow_back</span>
      </button>
      <div class="board-brand-lockup">
        <svg class="board-brand-icon" viewBox="0 0 512 512" width="20" height="20" aria-hidden="true">
          <path d="M153.03 153.03 A150 150 0 1 1 358.97 358.97 A150 150 0 0 0 153.03 153.03 Z" fill="currentColor"/>
          <path d="M153.03 153.03 A150 150 0 1 0 358.97 358.97 A150 150 0 0 1 153.03 153.03 Z" fill="currentColor"/>
          <path d="M241.59 241.59 L476.35 431.09 L386.18 431.44 Z" fill="currentColor"/>
        </svg>
      </div>
      <input type="text" id="board-title-input" class="board-title-input" value="Espaço Sem Título" placeholder="Nome do espaço..." aria-label="Nome do espaço" />
      <span id="board-save-status" class="board-save-status">
        <span class="qd-icon material-symbols-rounded status-icon">check</span> salvo
      </span>
    </div>

    <!-- Ferramentas Centrais -->
    <div class="board-header-center">
      <div class="board-tools-group">
        <button id="tool-select" class="board-tool-btn active" title="Selecionar e mover (V)" aria-label="Mover e selecionar">
          <span class="qd-icon material-symbols-rounded">pan_tool</span>
        </button>
        <button id="tool-card" class="board-tool-btn" title="Adicionar cartão (C)" aria-label="Adicionar cartão">
          <span class="qd-icon material-symbols-rounded">note_add</span>
          <span>Cartão</span>
        </button>
        <button id="tool-arrow" class="board-tool-btn" title="Conectar com seta (A)" aria-label="Conectar com seta">
          <span class="qd-icon material-symbols-rounded">trending_flat</span>
          <span>Seta</span>
        </button>
        <button id="tool-image" class="board-tool-btn" title="Adicionar imagem" aria-label="Adicionar imagem">
          <span class="qd-icon material-symbols-rounded">image</span>
          <span>Imagem</span>
        </button>
        <button id="tool-group" class="board-tool-btn" title="Adicionar grupo (G)" aria-label="Adicionar grupo">
          <span class="qd-icon material-symbols-rounded">crop_square</span>
          <span>Grupo</span>
        </button>
        <button id="tool-note-link" class="board-tool-btn" title="Vincular nota existente" aria-label="Vincular nota existente">
          <span class="qd-icon material-symbols-rounded">link</span>
          <span>Vincular nota</span>
        </button>
        <button id="tool-note-create" class="board-tool-btn" title="Criar nota e adicionar ao espaço" aria-label="Criar nota e adicionar ao espaço">
          <span class="qd-icon material-symbols-rounded">note_add</span>
          <span>Nova nota</span>
        </button>
        <input type="file" id="board-image-upload-input" accept="image/*" style="display:none;" />
      </div>
    </div>

    <!-- Controles de Câmera e Ações à Direita -->
    <div class="board-header-right">
      <div class="board-zoom-group">
        <button id="btn-zoom-out" class="board-btn icon-btn" title="Diminuir zoom (-)" aria-label="Diminuir zoom">
          <span class="qd-icon material-symbols-rounded">remove</span>
        </button>
        <span id="zoom-level-text" class="zoom-level-text">100%</span>
        <button id="btn-zoom-in" class="board-btn icon-btn" title="Aumentar zoom (+)" aria-label="Aumentar zoom">
          <span class="qd-icon material-symbols-rounded">add</span>
        </button>
        <button id="btn-zoom-reset" class="board-btn icon-btn" title="Centralizar conteúdo (0)" aria-label="Centralizar conteúdo">
          <span class="qd-icon material-symbols-rounded">filter_center_focus</span>
        </button>
      </div>
      <button id="btn-toggle-bg" class="board-btn icon-btn" title="Fundo: Modo Estrelas (clique para alternar)" aria-label="Alternar modo do fundo">
        <span class="qd-icon material-symbols-rounded" id="bg-mode-icon">auto_awesome</span>
      </button>
      <button id="btn-export-json" class="board-btn" title="Exportar espaço (.json)" aria-label="Exportar espaço">
        <span class="qd-icon material-symbols-rounded">download</span>
        <span>Exportar</span>
      </button>
      <button id="btn-toggle-theme" class="board-btn icon-btn" title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <span class="qd-icon material-symbols-rounded" id="theme-icon">dark_mode</span>
      </button>
    </div>
  </header>

  <!-- Contêiner do Espaço Infinito -->
  <main id="board-container" class="board-container">
    <!-- Camada DOM do Mundo Espacial (transformado por zoom/pan) -->
    <div id="board-world" class="board-world">
      <!-- Camada SVG de Conexões e Setas em Coordenadas do Mundo (Zero Jitter) -->
      <svg id="board-svg" class="board-svg">
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 8 3 L 0 6 z" fill="currentColor" />
          </marker>
          <marker id="arrowhead-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M 8 0 L 0 3 L 8 6 z" fill="currentColor" />
          </marker>
          <marker id="arrowhead-selected" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 8 3 L 0 6 z" fill="var(--accent, #3b82f6)" />
          </marker>
        </defs>
        <g id="board-svg-guides"></g>
        <g id="board-svg-arrows"></g>
        <path id="board-draft-arrow" class="draft-arrow" d="" marker-end="url(#arrowhead)" hidden />
      </svg>
      <div id="board-cards-layer" class="board-cards-layer"></div>
      <div id="board-selection-box" class="board-selection-box" hidden></div>
    </div>
    <div id="board-selection-toolbar" class="board-selection-toolbar" hidden></div>
  </main>

  <script src="../lib/dexie.min.js"></script>
  <script type="module" src="board.js"></script>
</body>
</html>
