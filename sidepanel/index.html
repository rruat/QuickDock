<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickDock</title>
  <!-- O CSS do Google Fonts vem primeiro: ele mesmo define uma regra
       ".material-symbols-rounded { font-size: 24px; ... }" e, em caso de
       empate de especificidade, quem carrega por último vence — então o
       nosso style.css precisa vir depois para conseguir sobrescrever isso. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="booting">
  <!-- Véu de carregamento: cobre o painel inteiro e dissolve quando o app fica
       pronto, revelando a marca d'água que já estava no lugar por baixo dele. -->
  <div id="boot-veil" class="boot-veil" aria-hidden="true"></div>

  <div id="app">

    <!-- Sem header próprio: o painel lateral do Chrome já mostra o ícone e o
         nome da extensão logo acima. As ações globais moram no menu "⋯". -->
    <section class="note-section">
      <div class="note-row">
      <!-- Aside de "Todas as notas": abre pela esquerda e empurra a nota para a direita -->
      <aside id="notes-aside" class="notes-aside">
        <div class="notes-aside-head">
          <span>Notas</span>
          <button id="btn-notes-close" class="icon-btn notes-aside-action notes-aside-close" title="Fechar" aria-label="Fechar notas"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <!-- Ações da aside, no formato dos itens de menu: ícone à esquerda e texto -->
        <div class="notes-aside-menu">
          <button id="btn-aside-new" class="copy-opt notes-aside-item" title="Nova nota / Importar"><span class="copy-opt-icon"><svg viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></span><span class="copy-opt-value">Nova nota</span></button>
          <button id="btn-aside-templates" class="copy-opt notes-aside-item" title="Modelos"><span class="copy-opt-icon"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span class="copy-opt-value">Modelos</span></button>
          <div class="math-divider"></div>
        </div>
        <div id="notes-aside-list" class="notes-aside-list"></div>
      </aside>
      <div class="note-main">
      <div class="notes-tabbar">
        <div class="notes-pill">
          <button id="btn-notes-list" class="icon-btn" title="Todas as notas" aria-label="Mostrar notas"><svg viewBox="0 0 24 24"><path class="sidebar-fill" d="M6 4h3v16H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
          <button id="btn-new-note" class="icon-btn" title="Nova nota / Importar" aria-label="Nova nota"><svg viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
        </div>
        <input type="file" id="note-import-input" accept=".md,.txt,text/markdown,text/plain" hidden />
        <div id="notes-tabs" class="notes-tabs"></div>
        <div class="notes-pill">
          <button id="btn-app-menu" class="icon-btn" title="Mais opções" aria-label="Mais opções"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        </div>
      </div>
      <!-- Barra de modo modelo: o editor abaixo é o mesmo de sempre, só que
           o que se edita é um modelo e não uma nota. -->
      <div id="template-bar" class="template-bar" hidden>
        <div class="template-bar-head">
          <button id="template-bar-cancel" class="icon-btn template-bar-icon" title="Cancelar: sair sem salvar" aria-label="Cancelar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <input id="template-bar-name" class="template-bar-name" type="text" placeholder="Nome do modelo" aria-label="Nome do modelo" />
          <select id="template-bar-kind" class="template-bar-kind" title="Onde este modelo é usado">
            <option value="note">Nota</option>
            <option value="block">Bloco</option>
          </select>
          <button id="template-bar-save" class="icon-btn template-bar-icon template-bar-primary" title="Salvar modelo" aria-label="Salvar"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        </div>
      </div>

      <div class="note-watermark" aria-hidden="true">
        <svg viewBox="22.5 22.5 512 512" aria-hidden="true">
          <path d="M153.03 153.03 A150 150 0 1 1 358.97 358.97 A150 150 0 0 0 153.03 153.03 Z"/>
          <path d="M153.03 153.03 A150 150 0 1 0 358.97 358.97 A150 150 0 0 1 153.03 153.03 Z"/>
          <path d="M241.59 241.59 L476.35 431.09 L386.18 431.44 Z"/>
          <path d="M0 -58 C0 -10.4 10.4 0 58 0 C10.4 0 0 10.4 0 58 C0 10.4 -10.4 0 -58 0 C-10.4 0 0 -10.4 0 -58 Z" transform="translate(251.23 251.23) rotate(45)"/>
        </svg>
      </div>
      <div class="note-editor">
        <div id="note-editor-blocks" class="note-editor-blocks" contenteditable="true" spellcheck="false"></div>
      </div>
      <span id="save-indicator" class="save-indicator">salvo ✓</span>
      </div>
      <!-- Fade sobre a nota enquanto a aside está aberta: clicar nele fecha a aside -->
      <div id="notes-dim" class="note-dim" aria-hidden="true"></div>
      <!-- Página de modelos: cobre a área da nota (no lugar do menu que existia antes) -->
      <section id="templates-page" class="templates-page" hidden aria-label="Modelos">
        <header class="templates-page-head">
          <button id="btn-templates-back" class="icon-btn notes-aside-action" title="Voltar às notas" aria-label="Voltar às notas"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <span class="templates-page-title">Modelos</span>
        </header>
        <div id="templates-page-body" class="templates-page-body"></div>
        <footer class="templates-page-foot">
          <button id="btn-tpl-new" class="templates-page-btn">Criar do zero</button>
          <button id="btn-tpl-from-note" class="templates-page-btn">Salvar nota atual</button>
          <button id="btn-tpl-import-note" class="templates-page-btn">Importar modelo de nota</button>
          <button id="btn-tpl-import-block" class="templates-page-btn">Importar modelo de bloco</button>
        </footer>
        <input type="file" id="templates-import-input" accept=".md,.txt,text/markdown,text/plain" hidden />
      </section>
      </div>
    </section>

    <div id="resize-handle" class="resize-handle" title="Arraste para redimensionar"></div>

    <section class="docs-section">
      <div class="docs-header">
        <span class="docs-title">Documentos</span>
        <div class="docs-view-switch">
          <button id="btn-view-note" class="docs-view-opt" title="Só os desta nota (mais os gerais)">Nesta nota</button>
          <button id="btn-view-all" class="docs-view-opt" title="Todos os documentos, de todas as notas">Todos</button>
        </div>
        <button id="btn-upload" class="icon-btn" title="Adicionar arquivo">＋</button>
        <input type="file" id="file-input" accept="image/*,.pdf,.txt" multiple hidden />
      </div>
      <div id="group-bar" class="group-bar hidden">
        <span id="group-count"></span>
        <button id="btn-inject-selected" class="group-action-btn" title="Injetar selecionados na página">↗ Injetar</button>
        <button id="btn-scope-selected" class="group-action-btn" title="Vincular à nota aberta">📌 Vincular</button>
        <button id="btn-delete-selected" class="group-action-btn group-action-danger" title="Remover selecionados">🗑</button>
        <button id="btn-clear-selection" class="group-action-close" title="Cancelar seleção">✕</button>
      </div>

      <div id="drop-zone" class="drop-zone">
        <div id="doc-grid" class="doc-grid"></div>
        <button id="docs-hidden-hint" class="docs-hidden-hint" hidden></button>
        <div id="drop-hint" class="drop-hint">Arraste arquivos aqui, clique em ＋<br>ou cole uma imagem com Ctrl+V</div>
      </div>
    </section>

    <div id="inject-toast" class="inject-toast hidden">
      <span id="inject-toast-msg"></span>
      <button id="inject-cancel" class="toast-cancel">Cancelar</button>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-header">
        <span id="modal-title" class="modal-title"></span>
        <div id="gallery-nav" class="gallery-nav hidden">
          <button id="gallery-prev" class="icon-btn" title="Imagem anterior (←)">‹</button>
          <span id="gallery-counter" class="gallery-counter" title="Ver todas as imagens"></span>
          <button id="gallery-next" class="icon-btn" title="Próxima imagem (→)">›</button>
        </div>
        <button id="modal-close" class="icon-btn" title="Fechar">✕</button>
      </div>

      <div id="img-toolbar" class="img-toolbar hidden">
        <button id="btn-rot-left"  class="viewer-btn" title="Girar esquerda ([]">↺</button>
        <button id="btn-rot-right" class="viewer-btn" title="Girar direita (])">↻</button>
        <div class="toolbar-sep"></div>
        <button id="btn-zoom-out" class="viewer-btn" title="Afastar (−)">−</button>
        <span   id="zoom-label"   class="zoom-label">100%</span>
        <button id="btn-zoom-in"  class="viewer-btn" title="Aproximar (+)">+</button>
        <div class="toolbar-sep"></div>
        <button id="btn-zoom-fit" class="viewer-btn" title="Ajustar à tela (0)">⊡</button>
      </div>

      <div id="modal-body" class="modal-body"></div>
    </div>

  </div>

  <script src="../lib/dexie.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
